<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill The Sea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <h1>FILL THE SEA</h1>
    <p>World prototype</p>
    <div id="coordinates">X: 0 | Y: 0</div>
    <div class="help">WASD / Arrows: Walk · Scroll: Zoom · I: Inventory</div>
  </div>
  <div id="inventory" class="panel">
    <div class="panel-heading">
      <strong>INVENTORY</strong>
      <button id="closeInventory" aria-label="Close inventory">×</button>
    </div>
    <div class="inventory-item selected" id="aqueductItem">
      <div class="item-icon">▰</div>
      <div class="item-copy">
        <strong>Aqueduct</strong>
        <small>Build one segment per placement</small>
      </div>
      <div class="item-count"><span id="pipeCount">100</span><small>Pipe</small></div>
    </div>
    <div class="direction-label">Choose placement direction</div>
    <div class="direction-pad">
      <button data-dir="0">↖</button>
      <button data-dir="1">↑</button>
      <button data-dir="2">↗</button>
      <button data-dir="3">←</button>
      <button class="center-dir" disabled>＋</button>
      <button data-dir="4">→</button>
      <button data-dir="5">↙</button>
      <button data-dir="6">↓</button>
      <button data-dir="7">↘</button>
    </div>
    <div class="selected-direction" id="selectedDirection">Direction: North</div>
    <button id="placeButton" class="place-button">Place aqueduct · 1 Pipe</button>
    <p class="inventory-note">Each segment costs 1 Pipe. Build from the last segment, or from your position.</p>
  </div>
  <button id="inventoryToggle" class="inventory-toggle">Inventory <span>I</span></button>
  <div id="toast" aria-live="polite"></div>
  <script src="js/main.js"></script>
</body>
</html>

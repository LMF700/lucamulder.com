<!DOCTYPE html>
<html>

<head>
    <title>Notes</title>
    <link rel="stylesheet" href="../styles/notesstyle.css">
    <link rel="icon" type="image/png" href="../assets/fav_notes.png">
</head>

<body>
    <button id="sidebarToggle">☰</button>

    <div id="sidebar">

        <button id="new">New Note</button>

        <button id="lightMode" class="themeButton">
            <span class="sunIcon"></span>
        </button>

        <button id="twilightMode" class="themeButton">
            <span class="moonIcon"></span>
        </button>

        <div id="noteList">

        </div>

    </div>


    <div id="editorContainer">

        <div id="noNote">
            <p class="big">No note has been selected.</p>
            <p>Select a note from the sidebar or create a new one.</p>
        </div>


        <div id="editor" style="display: none;">

            <input
                id="title"
                placeholder="Title">


            <br><br>


            <div id="formatButtons">

                <button id="bold">
                    <b>B</b>
                </button>

                <button id="italic">
                    <i>I</i>
                </button>

                <button id="gemButton" title="Colors" aria-label="Open Gem Menu">
                    <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-label="Paintbrush"
                            role="img"
                        >
                        <!-- Brush handle -->
                        <path d="M14 6.5 17.5 10" />
                        <path d="M15.5 2.5 21.5 8.5" />

                        <!-- Ferrule -->
                        <path d="M14 6.5 17.5 10" />

                        <!-- Bristles -->
                        <path d="
                            M15.5 2.5
                            C16.8 1.2 19 1.2 20.3 2.5
                            C21.6 3.8 21.6 6 20.3 7.3
                            L11 16.6
                            C9.5 18.1 7.5 19.5 4 20
                            C4.5 16.5 5.9 14.5 7.4 13
                            Z
                        " />
                    </svg>
                </button>
            </div>


            <div
                id="body"
                contenteditable="true"
                role="textbox"
                aria-multiline="true"
                data-placeholder="Write your note...">
            </div>


            <br><br>


            <button id="save">
                Save
            </button>

            <button id="delete">
                Delete
            </button>


        </div>

    </div>


    <script src="../js/notes.js"></script>

</body>

</html>
